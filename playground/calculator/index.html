<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="screen">
        <input type="text">
    </div>
    <div class="oprator">
        <button class="text">+</button>
        <button class="text">-</button>
        <button class="text">*</button>
        <button class="text">0</button>

    </div>
    <div class="btn-1">
        <button class="text">1</button>
        <button class="text">2</button>
        <button class="text">3</button>
    </div>
    <div class="btn-2">
        <button class="text">4</button>
        <button class="text">5</button>
        <button class="text">6</button>
    </div>
    
    <div class="btn-3">
        <button class="text">7</button>
        <button class="text">8</button>
        <button class="text">9</button>
    </div>
</body>
<script src="source.js"></script>
</html>
